name: Build ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build for Linux ARM64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -tags "with_gvisor" \
          -ldflags "-s -w" \
          -o smartproxy-linux-arm64 ./cmd/smartproxy/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartproxy-linux-arm64
          path: smartproxy-linux-arm64
          retention-days: 7
