name: lwIP backend

on:
  pull_request:
    paths:
      - 'internal/tun/lwip/**'
      - 'third_party/lwip'
      - '.gitmodules'
      - '.github/workflows/lwip.yml'
  push:
    branches: [main]
    paths:
      - 'internal/tun/lwip/**'
      - 'third_party/lwip'
      - '.gitmodules'
      - '.github/workflows/lwip.yml'

jobs:
  c-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build lwIP adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          sh ./internal/tun/lwip/build.sh
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Run Go lwIP integration tests
        run: go test -v -tags with_lwip -race -count=1 ./internal/tun/lwip/...
